xt><text x="650" y="140" font-size="18" font-weight="600" text-anchor="middle" font-family="Source Serif 4,Georgia,serif">Check information</text><text x="650" y="168" font-size="15" text-anchor="middle" fill="#DCE8E0">Records stay accurate</text></g></svg>