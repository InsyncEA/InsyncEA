<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-labelledby="t" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title id="t">Illustrative round robin routing flow: customer picks a time, the priority team member gets the call first, and a backup takes it if the priority person is unavailable</title><rect width="760" height="300" rx="20" fill="#1B3A2D"/><g font-family="DM Sans,Arial,sans-serif" fill="#fff"><rect x="30" y="110" width="170" height="80" rx="14" fill="#fff" fill-opacity=".1" stroke="#fff" stroke-opacity=".3"/><text x="115" y="146" font-size="16" font-weight="600" text-anchor="middle">Customer picks</text><text x="115" y="168" font-size="16" font-weight="600" text-anchor="middle">a time</text><path d="M200 150H282" stroke="#C9A24B" stroke-width="2" stroke-dasharray="5 5"/><circle cx="330" cy="150" r="48" fill="#fff" fill-opacity=".08" stroke="#C9A24B" stroke-width="2"/><text x="330" y="146" font-size="14" font-weight="600" text-anchor="middle" font-family="Source Serif 4,Georgia,serif">Priority</text><text x="330" y="165" font-size="14" font-weight="600" text-anchor="middle" font-family="Source Serif 4,Georgia,serif">available?</text><path d="M376 140C425 130 425 75 470 75" stroke="#C9A24B" stroke-width="2" stroke-dasharray="5 5" fill="none"/><path d="M376 160C425 170 425 225 470 225" stroke="#C9A24B" stroke-width="2" stroke-dasharray="5 5" fill="none"/><text x="428" y="112" font-size="13" fill="#B7E4C7">Yes</text><text x="428" y="200" font-size="13" fill="#B7E4C7">No</text><rect x="470" y="40" width="260" height="70" rx="14" fill="#52B788" fill-opacity=".22" stroke="#52B788" stroke-opacity=".8"/><text x="600" y="72" font-size="16" font-weight="600" text-anchor="middle">Priority team member</text><text x="600" y="92" font-size="13" text-anchor="middle" fill="#DCE8E0">gets the call first</text><rect x="470" y="190" width="260" height="70" rx="14" fill="#C9A24B" fill-opacity=".2" stroke="#C9A24B" stroke-opacity=".8"/><text x="600" y="222" font-size="16" font-weight="600" text-anchor="middle">Backup team member</text><text x="600" y="242" font-size="13" text-anchor="middle" fill="#DCE8E0">takes it if unavailable</text><text x="380" y="288" font-size="13" text-anchor="middle" fill="#DCE8E0">An illustrative routing flow. No client data is shown.</text></g></svg>