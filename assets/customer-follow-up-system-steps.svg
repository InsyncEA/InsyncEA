<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 220" width="760" height="220" role="img" aria-labelledby="t" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title id="t">Customer follow-up system steps: collect, assign, remind and follow up</title><rect width="760" height="220" rx="20" fill="#1B3A2D"/><g font-family="DM Sans,Arial,sans-serif" fill="#fff"><path d="M110 70H650" stroke="#C9A24B" stroke-opacity=".6" stroke-width="2"/><circle cx="110" cy="70" r="28" fill="#C9A24B"/><text x="110" y="80" font-size="26" font-weight="600" text-anchor="middle" fill="#1B3A2D" font-family="Source Serif 4,Georgia,serif">1</text><text x="110" y="140" font-size="18" font-weight="600" text-anchor="middle" font-family="Source Serif 4,Georgia,serif">Collect</text><text x="110" y="168" font-size="15" text-anchor="middle" fill="#DCE8E0">Messages from every inbox</text><circle cx="290" cy="70" r="28" fill="#C9A24B"/><text x="290" y="80" font-size="26" font-weight="600" text-anchor="middle" fill="#1B3A2D" font-family="Source Serif 4,Georgia,serif">2</text><text x="290" y="140" font-size="18" font-weight="600" text-anchor="middle" font-family="Source Serif 4,Georgia,serif">Assign</text><text x="290" y="168" font-size="15" text-anchor="middle" fill="#DCE8E0">An owner for each</text><circle cx="470" cy="70" r="28" fill="#C9A24B"/><text x="470" y="80" font-size="26" font-weight="600" text-anchor="middle" fill="#1B3A2D" font-family="Source Serif 4,Georgia,serif">3</text><text x="470" y="140" font-size="18" font-weight="600" text-anchor="middle" font-family="Source Serif 4,Georgia,serif">Remind</text><text x="470" y="168" font-size="15" text-anchor="middle" fill="#DCE8E0">Follow-up dates set</text><circle cx="650" cy="70" r="28" fill="#C9A24B"/><text x="650" y="80" font-size="26" font-weight="600" text-anchor="middle" fill="#1B3A2D" font-family="Source Serif 4,Georgia,serif">4</text><text x="650" y="140" font-size="18" font-weight="600" text-anchor="middle" font-family="Source Serif 4,Georgia,serif">Follow up</text><text x="650" y="168" font-size="15" text-anchor="middle" fill="#DCE8E0">Until it closes</text></g></svg>