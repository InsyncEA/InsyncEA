<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-labelledby="t" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title id="t">Illustrative subscription support flow: customer asks to subscribe, pays with M-Pesa or PayPal, payment problems are troubleshot and the subscription becomes active</title><rect width="760" height="300" rx="20" fill="#1B3A2D"/><g font-family="DM Sans,Arial,sans-serif" fill="#fff"><text x="380" y="62" font-size="20" font-weight="600" text-anchor="middle" font-family="Source Serif 4,Georgia,serif">Supporting a subscription, step by step</text><rect x="34" y="110" width="148" height="84" rx="14" fill="#fff" fill-opacity=".18" stroke="#fff" stroke-opacity=".8"/><text x="108" y="146" font-size="15" font-weight="600" text-anchor="middle">Customer asks</text><text x="108" y="168" font-size="13" text-anchor="middle" fill="#DCE8E0">to subscribe</text><path d="M182 152H218" stroke="#C9A24B" stroke-width="2" stroke-dasharray="5 5"/><rect x="218" y="110" width="148" height="84" rx="14" fill="#fff" fill-opacity=".18" stroke="#fff" stroke-opacity=".8"/><text x="292" y="146" font-size="15" font-weight="600" text-anchor="middle">Pays with</text><text x="292" y="168" font-size="13" text-anchor="middle" fill="#DCE8E0">M-Pesa or PayPal</text><path d="M366 152H402" stroke="#C9A24B" stroke-width="2" stroke-dasharray="5 5"/><rect x="402" y="110" width="148" height="84" rx="14" fill="#C9A24B" fill-opacity=".18" stroke="#C9A24B" stroke-opacity=".8"/><text x="476" y="146" font-size="15" font-weight="600" text-anchor="middle">Problem?</text><text x="476" y="168" font-size="13" text-anchor="middle" fill="#DCE8E0">Troubleshoot together</text><path d="M550 152H586" stroke="#C9A24B" stroke-width="2" stroke-dasharray="5 5"/><rect x="586" y="110" width="148" height="84" rx="14" fill="#52B788" fill-opacity=".18" stroke="#52B788" stroke-opacity=".8"/><text x="660" y="146" font-size="15" font-weight="600" text-anchor="middle">Subscription</text><text x="660" y="168" font-size="13" text-anchor="middle" fill="#DCE8E0">is active</text><text x="380" y="262" font-size="14" text-anchor="middle" fill="#DCE8E0">An illustrative flow. No client data is shown.</text></g></svg>