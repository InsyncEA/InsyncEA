name: Build blog pages and related articles
on:
  push:
    branches: [main, master]
    paths:
      - 'content/blog/**'
      - 'assets/posts.json'
      - 'blog/**'
      - 'tools/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install tools
        run: pip install markdown pyyaml
      - name: Build blog pages from the CMS articles
        run: python3 tools/build_posts.py
      - name: Write related articles into the HTML
        run: python3 tools/build_related.py
      - name: Save changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Update blog pages and related articles"
            git push
          fi
